name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cypress run (desktop)
        uses: cypress-io/github-action@v6

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cypress run (mobile)
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:mobile
