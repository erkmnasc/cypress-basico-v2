name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # toda segunda-feira, 8h (horário de Brasília): avisa se algo quebrar sem mudança no código
    - cron: "0 11 * * 1"

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cypress run (desktop)
        uses: cypress-io/github-action@v7

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cypress run (mobile)
        uses: cypress-io/github-action@v7
        with:
          command: npm run test:mobile
